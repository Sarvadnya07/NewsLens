<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <linearGradient id="fav-saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="fav-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="fav-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#0A1128" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Outer Precision Barrel Ring -->
  <circle cx="32" cy="32" r="24" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85" />
  <circle cx="32" cy="32" r="20" stroke="#1D4ED8" stroke-width="1.2" opacity="0.6" />

  <!-- Iris Body -->
  <circle cx="32" cy="32" r="17" fill="url(#fav-iris)" />

  <!-- Refraction Aperture Blades -->
  <!-- Top Saffron Blade -->
  <path d="M 32 15 C 38 15, 43 19, 46 24 L 37 29 C 35 26, 33 24, 32 15 Z" fill="url(#fav-saffron)" />
  <!-- Upper Right Cobalt Blade -->
  <path d="M 46 24 C 49 29, 49 35, 46 40 L 38 35 C 39 33, 39 30, 37 29 Z" fill="url(#fav-cobalt)" />
  <!-- Lower Green Blade -->
  <path d="M 46 40 C 43 45, 37 48, 31 48 L 32 39 C 34 39, 36 37, 38 35 Z" fill="url(#fav-emerald)" />
  <!-- Bottom Left Cyan Blade -->
  <path d="M 31 48 C 25 48, 20 44, 18 39 L 27 35 C 28 37, 30 39, 32 39 Z" fill="#0284C7" />
  <!-- Upper Left Azure Blade -->
  <path d="M 18 39 C 15 34, 16 27, 19 23 L 27 29 C 26 31, 26 33, 27 35 Z" fill="#3B82F6" />
  <!-- Top Left Saffron Blade -->
  <path d="M 19 23 C 23 18, 28 15, 32 15 L 32 24 C 30 24, 28 26, 27 29 Z" fill="#FB923C" />

  <!-- Center Pupil & Lens Crosshairs -->
  <circle cx="32" cy="32" r="6" fill="#0A1128" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="32" cy="32" r="2.5" fill="#38BDF8" />

  <!-- Reticle Crosshair Ticks -->
  <line x1="32" y1="20" x2="32" y2="23" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="41" x2="32" y2="44" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="20" y1="32" x2="23" y2="32" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="41" y1="32" x2="44" y2="32" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
</svg>
