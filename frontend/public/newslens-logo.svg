<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" width="240" height="64">
  <defs>
    <!-- Background glow & gradients -->
    <linearGradient id="nl-saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="nl-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="nl-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="nl-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="nl-iris-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="1" />
    </radialGradient>
    <filter id="nl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left side) -->
  <g transform="translate(8, 6)">
    <!-- Outer Precision Ring (Lens Barrel) -->
    <circle cx="26" cy="26" r="24" stroke="url(#nl-ring)" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85" />
    <circle cx="26" cy="26" r="21" stroke="#1E3A8A" stroke-width="1" opacity="0.6" />

    <!-- Lens Iris Body -->
    <circle cx="26" cy="26" r="18" fill="url(#nl-iris-glow)" />

    <!-- Aperture / Refraction Blades (Tricolor + Optics) -->
    <!-- Top Saffron Blade -->
    <path d="M 26 8 C 33 8, 38 12, 41 18 L 31 23 C 29 20, 27 18, 26 8 Z" fill="url(#nl-saffron)" />
    <!-- Upper Right Cyan Beam -->
    <path d="M 41 18 C 44 23, 44 30, 41 35 L 32 29 C 33 27, 33 24, 31 23 Z" fill="url(#nl-cobalt)" />
    <!-- Lower Green Blade -->
    <path d="M 41 35 C 37 41, 31 44, 25 44 L 26 34 C 28 34, 30 32, 32 29 Z" fill="url(#nl-emerald)" />
    <!-- Bottom Left Cyan Blade -->
    <path d="M 25 44 C 18 44, 13 40, 11 34 L 21 29 C 22 32, 24 34, 26 34 Z" fill="#0284C7" />
    <!-- Upper Left Azure Blade -->
    <path d="M 11 34 C 8 28, 9 21, 12 16 L 21 23 C 20 25, 20 28, 21 29 Z" fill="#3B82F6" />
    <!-- Top Left Saffron Accent -->
    <path d="M 12 16 C 16 11, 21 8, 26 8 L 26 18 C 24 18, 22 20, 21 23 Z" fill="#FB923C" />

    <!-- Central Lens Pupil / Crosshair Target -->
    <circle cx="26" cy="26" r="6" fill="#0A1128" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="26" cy="26" r="2.5" fill="#38BDF8" filter="url(#nl-glow)" />

    <!-- Precision Crosshairs -->
    <line x1="26" y1="13" x2="26" y2="16" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="26" y1="36" x2="26" y2="39" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="13" y1="26" x2="16" y2="26" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="36" y1="26" x2="39" y2="26" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(70, 14)">
    <!-- Brand Title: NewsLens -->
    <text x="0" y="24" font-family="'Newsreader', 'Georgia', serif" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">
      News<tspan fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800">Lens</tspan>
    </text>

    <!-- INDIA Tag with Tricolor Pill -->
    <g transform="translate(112, 6)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="7" y="13" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#F8FAFC" letter-spacing="1.5">
        INDIA
      </text>
      <!-- Tricolor dots -->
      <circle cx="38" cy="6" r="1.5" fill="#FF9933" />
      <circle cx="38" cy="9.5" r="1.5" fill="#FFFFFF" />
      <circle cx="38" cy="13" r="1.5" fill="#138808" />
    </g>

    <!-- Tagline -->
    <text x="0" y="38" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#94A3B8" letter-spacing="0.2">
      See coverage. Examine evidence.
    </text>
  </g>
</svg>
