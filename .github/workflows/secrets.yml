name: Secret & Credential Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detection
        # Pin gitleaks-action to immutable SHA (v2.3.8)
        uses: gitleaks/gitleaks-action@e85c26b485a4487b41113b2c953535926615b3c3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
