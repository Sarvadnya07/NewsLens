name: Bug Report
description: File a reproducible defect report for NewsLens India.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide sufficient context so we can reproduce and verify the fix.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      placeholder: Brief description of the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start application with `streamlit run app.py`
        2. Navigate to ...
        3. Trigger action ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Traceback
      placeholder: Error message or terminal traceback...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux (Ubuntu/Debian)
        - macOS
    validations:
      required: true
